name: Bug report
description: Report a defect so we can fix it.
title: "bug: <short description>"
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please do **not** report security
        vulnerabilities here — see [SECURITY.md](../../SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: When I call POST /v1/widgets with ... I get ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal, deterministic steps. Include a curl command if possible.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / request id
      description: Paste structured logs or the `x-request-id` if you have it.
      render: shell
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v1.4.2 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - local (pnpm dev)
        - container (docker)
        - staging
        - production
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
      placeholder: "22.13.1"
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This is not a security vulnerability (those go via SECURITY.md).
          required: true
